name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python experiments/exact_small_n.py --max-order 6 --output regenerated.json
      - run: diff -u results/exact_small_n.json regenerated.json

  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra
      - run: latexmk -pdf -cd -interaction=nonstopmode -halt-on-error paper/report.tex
